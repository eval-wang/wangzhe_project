<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者地图 20×20 网格标注工具 · 防御塔配置版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #000000;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            color: #eee;
        }
        h1 {
            font-weight: 400;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            background: #111111;
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .toolbar label {
            background: #3b3b52;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .toolbar label:hover {
            background: #50507a;
        }
        .toolbar input[type="file"] {
            display: none;
        }
        .toolbar button {
            background: #4a6cf7;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .toolbar button:hover {
            background: #5f7df9;
            transform: scale(1.02);
        }
        .toolbar button.danger {
            background: #c44a4a;
        }
        .toolbar button.danger:hover {
            background: #d65a5a;
        }
        .canvas-wrapper {
            background: #000000;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            flex-shrink: 0;
            overflow: auto;
            max-width: 100%;
        }
        canvas {
            display: block;
            width: 800px;
            height: 800px;
            image-rendering: pixelated;  /* 保持锐利 */
            cursor: crosshair;
            border-radius: 8px;
            background: #000000;
            flex-shrink: 0;
        }
        .info {
            margin-top: 12px;
            display: flex;
            gap: 30px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* ===== 防御塔配置面板（宽扁窗口） ===== */
        .tower-panels {
            margin-top: 18px;
            width: 90%;
            max-width: 900px;
            display: flex;
            gap: 16px;
        }
        .tower-panel {
            flex: 1;
            background: #111111;
            border-radius: 12px;
            padding: 12px 18px 14px;
            border: 1px solid #222;
        }
        .tower-panel .panel-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .tower-panel.white .panel-title { color: #f0f0f0; }
        .tower-panel.black .panel-title { color: #9aa0b0; }
        .lane-inputs {
            display: flex;
            gap: 14px;
            justify-content: space-between;
        }
        .lane-inputs label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            opacity: 0.85;
            flex: 1;
        }
        .lane-inputs input[type="number"] {
            width: 64px;
            padding: 6px 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            background: #000000;
            color: #eee;
            border: 1px solid #3b3b52;
            border-radius: 8px;
            outline: none;
        }
        .lane-inputs input[type="number"]:focus {
            border-color: #4a6cf7;
        }
        .gen-row {
            margin-top: 14px;
            width: 90%;
            max-width: 900px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .gen-row button {
            flex: 1;
            background: #2f9e63;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .gen-row button:hover {
            background: #35b872;
            transform: scale(1.01);
        }
        .gen-row .crystal-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            opacity: 0.8;
            white-space: nowrap;
            cursor: pointer;
        }
        .gen-hint {
            width: 90%;
            max-width: 900px;
            font-size: 12px;
            opacity: 0.45;
            margin-top: 6px;
        }

        .export-area {
            margin-top: 18px;
            width: 90%;
            max-width: 900px;
            background: #111111;
            border-radius: 12px;
            padding: 12px;
        }
        .export-area textarea {
            width: 100%;
            height: 160px;
            background: #000000;
            color: #c8d0e0;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            white-space: pre;
            tab-size: 4;
        }
        .export-area .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .export-area .row span {
            font-size: 13px;
            opacity: 0.6;
        }
        .hint {
            font-size: 13px;
            opacity: 0.5;
            margin-top: 6px;
        }
        .badge {
            background: #222222;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="canvas-wrapper">
    <canvas id="mapCanvas" width="800" height="800"></canvas>
</div>


<!-- ===== 防御塔配置：两个宽扁窗口 ===== -->
<div class="tower-panels">
    <div class="tower-panel white">
        <div class="panel-title">⚪ 我方防御塔（白棋）· 剩余数量</div>
        <div class="lane-inputs">
            <label>上路<input type="number" id="w-top" min="0" max="3" step="1" value="3"></label>
            <label>中路<input type="number" id="w-mid" min="0" max="3" step="1" value="3"></label>
            <label>下路<input type="number" id="w-bot" min="0" max="3" step="1" value="3"></label>
        </div>
    </div>
    <div class="tower-panel black">
        <div class="panel-title">⚫ 敌方防御塔（黑棋）· 剩余数量</div>
        <div class="lane-inputs">
            <label>上路<input type="number" id="b-top" min="0" max="3" step="1" value="3"></label>
            <label>中路<input type="number" id="b-mid" min="0" max="3" step="1" value="3"></label>
            <label>下路<input type="number" id="b-bot" min="0" max="3" step="1" value="3"></label>
        </div>
    </div>
</div>

<div class="gen-row">
    <button id="genTowersBtn">🏰 一键生成防御塔</button>
    <label class="crystal-check"><input type="checkbox" id="showCrystal" checked> 同时放置双方水晶</label>
</div>

<div class="gen-hint">💡 数字 0–3 表示该分路「剩余」防御塔数量。按游戏规则外塔先被摧毁：剩 3 = 一/二/三塔全在；剩 2 = 剩二塔+三塔；剩 1 = 仅剩三塔；剩 0 = 该路塔全毁。生成会清空当前棋盘上的所有棋子。</div>

<h1>🗺️ 20×20 网格标注器 · 防御塔配置版</h1>

<div class="toolbar">
    <label for="imageUpload">📁 更换背景图</label>
    <input type="file" id="imageUpload" accept="image/*">
    <button id="exportBtn">⬇️ 导出 CSV</button>
    <button id="clearBtn" class="danger">🗑️ 清空标注</button>
    <span class="badge" id="countDisplay">已填 0 格</span>
</div>

<div class="info">
    <span>⚪ 左键点击格子 → 放置/移除白色棋子</span>
    <span>⚫ 右键点击格子 → 放置/移除黑色棋子</span>
    <span>📐 网格 20×20</span>
</div>

<div class="export-area">
    <div class="row">
        <span>📋 导出数据 (CSV: 行,列,符号；W=白棋 B=黑棋)</span>
        <div style="display:flex;gap:8px;">
            <button id="importBtn" style="background:#f0a040;border:none;color:#1a1a1a;padding:4px 16px;border-radius:20px;cursor:pointer;font-weight:600;">📥 反向导入</button>
            <button id="copyBtn" style="background:#3a3a5a;border:none;color:#eee;padding:4px 16px;border-radius:20px;cursor:pointer;">📄 复制</button>
        </div>
    </div>
    <textarea id="outputText" placeholder="可粘贴 CSV 数据后点击「反向导入」填充棋盘（符号用 W 或 B），或标注后点击「导出 CSV」…"></textarea>
    <div class="hint">💡 行、列均从 0 开始（左上角为 0,0）；符号：W=白色棋子，B=黑色棋子</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const outputText = document.getElementById('outputText');
        const countDisplay = document.getElementById('countDisplay');

        const GRID = 20;
        let gridData = Array.from({ length: GRID }, () => Array(GRID).fill(''));
        let imageLoaded = false;
        let img = null;

        // ===== 防御塔位置表（来源：棋盘防御塔网格图.csv）=====
        // 每条分路按 一塔 → 二塔 → 三塔（由外向内）排列，坐标为 2×2 区块的左上角 (行,列)
        const TOWER_POS = {
            W: { // 我方（白棋）
                top: [[4, 0], [10, 0], [14, 0]],      // 上路：左边缘
                mid: [[11, 7], [13, 5], [15, 3]],     // 中路：对角线
                bot: [[18, 13], [18, 8], [18, 4]],    // 下路：底边缘
                crystal: [17, 1]                       // 我方水晶
            },
            B: { // 敌方（黑棋）
                top: [[13, 18], [8, 18], [4, 18]],    // 敌方上路：右边缘
                mid: [[7, 11], [5, 13], [3, 15]],     // 敌方中路：对角线
                bot: [[0, 4], [0, 10], [0, 14]],      // 敌方下路：顶边缘
                crystal: [1, 17]                       // 敌方水晶
            }
        };

        // ---- 绘制 ----
        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cellW = w / GRID;
            const cellH = h / GRID;

            // 清空
            ctx.clearRect(0, 0, w, h);

            // 绘制背景图片（若有）
            if (img && imageLoaded) {
                ctx.drawImage(img, 0, 0, w, h);
            } else {
                // 无图片时显示黑色背景
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, w, h);
            }

            // 绘制半透明网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellW, 0);
                ctx.lineTo(i * cellW, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellH);
                ctx.lineTo(w, i * cellH);
                ctx.stroke();
            }

            // 绘制棋子（W=白色，B=黑色）
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const val = gridData[r][c];
                    if (!val) continue;
                    const cx = c * cellW + cellW / 2;
                    const cy = r * cellH + cellH / 2;
                    const radius = Math.min(cellW, cellH) * 0.38;

                    // 棋子主体
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = (val === 'W') ? '#f5f5f5' : '#111111';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = (val === 'W') ? '#333333' : '#dddddd';
                    ctx.stroke();

                    // 高光
                    ctx.beginPath();
                    ctx.arc(cx - radius * 0.3, cy - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = (val === 'W') ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)';
                    ctx.fill();
                }
            }

            // 更新计数
            let filled = 0;
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    if (gridData[r][c]) filled++;
                }
            }
            countDisplay.textContent = `已填 ${filled} 格`;
        }

        // ---- 工具函数：坐标转行列 ----
        function getGridIndex(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            if (mouseX < 0 || mouseY < 0 || mouseX > canvas.width || mouseY > canvas.height) return null;
            const col = Math.floor(mouseX / (canvas.width / GRID));
            const row = Math.floor(mouseY / (canvas.height / GRID));
            if (row < 0 || row >= GRID || col < 0 || col >= GRID) return null;
            return { row, col };
        }

        // ---- 事件绑定（围棋式落子）----
        // 左键：放置/移除白色棋子；右键：放置/移除黑色棋子
        function toggleStone(e, color) {
            if (!imageLoaded) {
                alert('背景图片尚未加载成功，请检查文件路径或点击「更换背景图」手动上传。');
                return;
            }
            const idx = getGridIndex(e);
            if (!idx) return;
            const { row, col } = idx;
            if (gridData[row][col] === color) {
                gridData[row][col] = '';   // 再次点击相同颜色 → 移除
            } else {
                gridData[row][col] = color; // 否则放置该颜色棋子（覆盖另一种颜色）
            }
            draw();
        }

        function handleCanvasClick(e) {
            toggleStone(e, 'W');
        }

        function handleCanvasRightClick(e) {
            e.preventDefault();
            toggleStone(e, 'B');
        }

        // ---- 固定背景图片 ----
        // 自动加载固定背景图（D:\wangzhe_project\相关素材\地图\正方形.png），
        // 依次尝试绝对路径与相对路径，提高兼容性。
        const DEFAULT_BG = [
            'file:///D:/wangzhe_project/相关素材/地图/正方形.png',
            '../相关素材/地图/正方形.png'
        ];

        function loadBackground(src, onFail) {
            const image = new Image();
            image.onload = function() {
                img = image;
                imageLoaded = true;
                draw();
            };
            image.onerror = function() {
                if (onFail) onFail();
            };
            image.src = src;
        }

        let bgIndex = 0;
        function tryLoadNextBg() {
            if (bgIndex >= DEFAULT_BG.length) {
                console.warn('固定背景图片加载失败，请点击「更换背景图」手动上传。');
                return;
            }
            loadBackground(DEFAULT_BG[bgIndex], function() {
                bgIndex++;
                tryLoadNextBg();
            });
        }
        tryLoadNextBg();

        // ---- 上传图片（用于更换背景）----
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const image = new Image();
                image.onload = function() {
                    img = image;
                    imageLoaded = true;
                    // 保持画布宽高比与图片一致？但我们固定800x800，拉伸填充
                    draw();
                };
                image.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ---- 导出 CSV ----
        function exportCSV() {
            let lines = [];
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const sym = gridData[r][c];
                    if (sym) {
                        lines.push(`${r},${c},${sym}`);
                    }
                }
            }
            if (lines.length === 0) {
                return '（无标注数据）';
            }
            return '行,列,符号\n' + lines.join('\n');
        }

        document.getElementById('exportBtn').addEventListener('click', function() {
            outputText.value = exportCSV();
        });

        // ---- 清空标注 ----
        function clearGrid() {
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    gridData[r][c] = '';
                }
            }
        }

        document.getElementById('clearBtn').addEventListener('click', function() {
            if (!confirm('确定要清空所有标注吗？')) return;
            clearGrid();
            draw();
            outputText.value = '';
        });

        // ---- 复制按钮 ----
        document.getElementById('copyBtn').addEventListener('click', function() {
            const text = outputText.value;
            if (!text) {
                alert('没有数据可复制，请先导出。');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 已复制到剪贴板！');
            }).catch(() => {
                // fallback
                outputText.select();
                document.execCommand('copy');
                alert('✅ 已复制！');
            });
        });

        // ---- 反向导入 CSV ----
        function importCSV(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length === 0) return 0;

            // 先清空
            clearGrid();

            let count = 0;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // 跳过表头行（如果包含中文列名或非数字开头）
                if (line.startsWith('行') || line.startsWith('row') || line.startsWith('Row')) continue;

                const parts = line.split(',');
                if (parts.length < 3) continue;

                const row = parseInt(parts[0], 10);
                const col = parseInt(parts[1], 10);
                // 符号可能包含逗号，所以第3列及之后的部分合并
                const symbol = parts.slice(2).join(',').trim();

                if (isNaN(row) || isNaN(col) || row < 0 || row >= GRID || col < 0 || col >= GRID) continue;
                if (!symbol) continue;

                gridData[row][col] = symbol.substring(0, 10);
                count++;
            }
            return count;
        }

        document.getElementById('importBtn').addEventListener('click', function() {
            const text = outputText.value.trim();
            if (!text) {
                alert('请先在文本框中粘贴 CSV 数据，格式：行,列,符号');
                return;
            }
            if (!confirm('导入将清空当前所有标注并用 CSV 数据填充，确认继续？')) return;

            const count = importCSV(text);
            draw();
            alert(`✅ 导入成功！共填充 ${count} 个格子。`);
        });

        // ===== 一键生成防御塔 =====
        // 读取并校验输入：0–3 的整数，非法值自动夹取到范围内
        function readLaneCount(id) {
            const el = document.getElementById(id);
            let n = parseInt(el.value, 10);
            if (isNaN(n)) n = 3;
            n = Math.max(0, Math.min(3, n));
            el.value = n;
            return n;
        }

        // 在 2×2 区块放置棋子，topLeft = [行, 列]
        function placeBlock(color, topLeft) {
            const [r, c] = topLeft;
            for (let dr = 0; dr < 2; dr++) {
                for (let dc = 0; dc < 2; dc++) {
                    gridData[r + dr][c + dc] = color;
                }
            }
        }

        document.getElementById('genTowersBtn').addEventListener('click', function() {
            const withCrystal = document.getElementById('showCrystal').checked;

            const config = {
                W: {
                    top: readLaneCount('w-top'),
                    mid: readLaneCount('w-mid'),
                    bot: readLaneCount('w-bot')
                },
                B: {
                    top: readLaneCount('b-top'),
                    mid: readLaneCount('b-mid'),
                    bot: readLaneCount('b-bot')
                }
            };

            // 清空当前棋盘后按规则重新落子
            clearGrid();

            let towerCount = 0;
            for (const side of ['W', 'B']) {
                for (const lane of ['top', 'mid', 'bot']) {
                    const remain = config[side][lane];
                    // 游戏规则：防御塔由外向内逐步摧毁，
                    // 剩余 n 座 = 最内侧的 n 座保留（先毁一塔，再二塔，最后三塔）
                    const survivors = TOWER_POS[side][lane].slice(3 - remain);
                    survivors.forEach(pos => {
                        placeBlock(side, pos);
                        towerCount++;
                    });
                }
                if (withCrystal) {
                    placeBlock(side, TOWER_POS[side].crystal);
                }
            }

            draw();
            // 同步生成 CSV 到导出框，方便直接复制
            outputText.value = exportCSV();
            console.log(`已生成 ${towerCount} 座防御塔${withCrystal ? '（含双方水晶）' : ''}。`);
        });

        // ---- 右键阻止上下文菜单 ----
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---- 绑定鼠标事件 ----
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // 右键
                handleCanvasRightClick(e);
            }
        });

        // ---- 初始绘制 ----
        draw();

        // 提示用户
        console.log('已自动加载固定背景图（正方形.png），左键落白棋、右键落黑棋。');
    })();
</script>

</body>
</html>
