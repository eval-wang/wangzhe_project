<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者地图 20×20 网格标注工具</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            color: #eee;
        }
        h1 {
            font-weight: 400;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            background: #2a2a3d;
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .toolbar label {
            background: #3b3b52;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .toolbar label:hover {
            background: #50507a;
        }
        .toolbar input[type="file"] {
            display: none;
        }
        .toolbar button {
            background: #4a6cf7;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .toolbar button:hover {
            background: #5f7df9;
            transform: scale(1.02);
        }
        .toolbar button.danger {
            background: #c44a4a;
        }
        .toolbar button.danger:hover {
            background: #d65a5a;
        }
        .canvas-wrapper {
            background: #0b0b14;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            flex-shrink: 0;
            overflow: auto;
            max-width: 100%;
        }
        canvas {
            display: block;
            width: 800px;
            height: 800px;
            image-rendering: pixelated;  /* 保持锐利 */
            cursor: crosshair;
            border-radius: 8px;
            background: #1a1a2a;
            flex-shrink: 0;
        }
        .info {
            margin-top: 12px;
            display: flex;
            gap: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
        .export-area {
            margin-top: 18px;
            width: 90%;
            max-width: 900px;
            background: #0f0f1a;
            border-radius: 12px;
            padding: 12px;
        }
        .export-area textarea {
            width: 100%;
            height: 160px;
            background: #1a1a2e;
            color: #c8d0e0;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            white-space: pre;
            tab-size: 4;
        }
        .export-area .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .export-area .row span {
            font-size: 13px;
            opacity: 0.6;
        }
        .hint {
            font-size: 13px;
            opacity: 0.5;
            margin-top: 6px;
        }
        .badge {
            background: #2a2a44;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<h1>🗺️ 20×20 网格标注器</h1>

<div class="toolbar">
    <label for="imageUpload">📁 选择图片</label>
    <input type="file" id="imageUpload" accept="image/*">
    <button id="exportBtn">⬇️ 导出 CSV</button>
    <button id="clearBtn" class="danger">🗑️ 清空标注</button>
    <span class="badge" id="countDisplay">已填 0 格</span>
</div>

<div class="canvas-wrapper">
    <canvas id="mapCanvas" width="800" height="800"></canvas>
</div>

<div class="info">
    <span>🖱️ 左键点击格子 → 输入内容（最多10个字符）</span>
    <span>🔄 右键点击格子 → 清除内容</span>
    <span>📐 网格 20×20</span>
</div>

<div class="export-area">
    <div class="row">
        <span>📋 导出数据 (CSV: 行,列,符号)</span>
        <div style="display:flex;gap:8px;">
            <button id="importBtn" style="background:#f0a040;border:none;color:#1a1a1a;padding:4px 16px;border-radius:20px;cursor:pointer;font-weight:600;">📥 反向导入</button>
            <button id="copyBtn" style="background:#3a3a5a;border:none;color:#eee;padding:4px 16px;border-radius:20px;cursor:pointer;">📄 复制</button>
        </div>
    </div>
    <textarea id="outputText" placeholder="可粘贴 CSV 数据后点击「反向导入」填充表格，或标注后点击「导出 CSV」…"></textarea>
    <div class="hint">💡 行、列均从 0 开始（左上角为 0,0）</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const outputText = document.getElementById('outputText');
        const countDisplay = document.getElementById('countDisplay');

        const GRID = 20;
        let gridData = Array.from({ length: GRID }, () => Array(GRID).fill(''));
        let imageLoaded = false;
        let img = null;

        // ---- 绘制 ----
        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cellW = w / GRID;
            const cellH = h / GRID;

            // 清空
            ctx.clearRect(0, 0, w, h);

            // 绘制背景图片（若有）
            if (img && imageLoaded) {
                ctx.drawImage(img, 0, 0, w, h);
            } else {
                // 无图片时显示深色背景
                ctx.fillStyle = '#1a1a2a';
                ctx.fillRect(0, 0, w, h);
            }

            // 绘制半透明网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellW, 0);
                ctx.lineTo(i * cellW, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellH);
                ctx.lineTo(w, i * cellH);
                ctx.stroke();
            }

            // 绘制格子中的符号
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 6;

            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const symbol = gridData[r][c];
                    if (symbol) {
                        // 根据字符数动态调整字体大小，确保最多10个字符也能完整显示
                        const len = symbol.length;
                        const maxFontSize = Math.min(cellW, cellH) * 0.55;
                        const targetW = cellW * 0.9; // 留10%边距
                        const fontSizeByWidth = targetW / len;
                        const fontSize = Math.min(maxFontSize, fontSizeByWidth * 1.4);
                        ctx.font = `${fontSize}px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Arial", sans-serif`;
                        const x = c * cellW + cellW / 2;
                        const y = r * cellH + cellH / 2;
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = 'rgba(0,0,0,0.9)';
                        ctx.fillText(symbol, x, y + 1);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#f0f4ff';
                        ctx.fillText(symbol, x, y);
                    }
                }
            }
            ctx.shadowBlur = 0;

            // 更新计数
            let filled = 0;
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    if (gridData[r][c]) filled++;
                }
            }
            countDisplay.textContent = `已填 ${filled} 格`;
        }

        // ---- 工具函数：坐标转行列 ----
        function getGridIndex(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            if (mouseX < 0 || mouseY < 0 || mouseX > canvas.width || mouseY > canvas.height) return null;
            const col = Math.floor(mouseX / (canvas.width / GRID));
            const row = Math.floor(mouseY / (canvas.height / GRID));
            if (row < 0 || row >= GRID || col < 0 || col >= GRID) return null;
            return { row, col };
        }

        // ---- 弹出输入框 ----
        function promptSymbol(row, col) {
            const current = gridData[row][col];
            const msg = `格子 (${row}, ${col}) 当前内容: ${current || '空'}\n请输入新内容 (最多10个字符，支持中文/英文/数字，留空则清除)`;
            const input = prompt(msg, current || '');
            if (input === null) return; // 取消
            const newVal = input.trim();
            if (newVal === '') {
                gridData[row][col] = '';
            } else {
                // 最多取10个字符
                gridData[row][col] = newVal.substring(0, 10);
            }
            draw();
        }

        // ---- 事件绑定 ----
        function handleCanvasClick(e) {
            if (!imageLoaded) {
                alert('请先上传一张图片作为背景。');
                return;
            }
            const idx = getGridIndex(e);
            if (!idx) return;
            promptSymbol(idx.row, idx.col);
        }

        function handleCanvasRightClick(e) {
            e.preventDefault();
            if (!imageLoaded) return;
            const idx = getGridIndex(e);
            if (!idx) return;
            const { row, col } = idx;
            if (gridData[row][col]) {
                gridData[row][col] = '';
                draw();
            }
        }

        // ---- 上传图片 ----
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const image = new Image();
                image.onload = function() {
                    img = image;
                    imageLoaded = true;
                    // 保持画布宽高比与图片一致？但我们固定800x800，拉伸填充
                    draw();
                };
                image.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ---- 导出 CSV ----
        function exportCSV() {
            let lines = [];
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const sym = gridData[r][c];
                    if (sym) {
                        lines.push(`${r},${c},${sym}`);
                    }
                }
            }
            if (lines.length === 0) {
                return '（无标注数据）';
            }
            return '行,列,符号\n' + lines.join('\n');
        }

        document.getElementById('exportBtn').addEventListener('click', function() {
            outputText.value = exportCSV();
        });

        // ---- 清空标注 ----
        document.getElementById('clearBtn').addEventListener('click', function() {
            if (!confirm('确定要清空所有标注吗？')) return;
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    gridData[r][c] = '';
                }
            }
            draw();
            outputText.value = '';
        });

        // ---- 复制按钮 ----
        document.getElementById('copyBtn').addEventListener('click', function() {
            const text = outputText.value;
            if (!text) {
                alert('没有数据可复制，请先导出。');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 已复制到剪贴板！');
            }).catch(() => {
                // fallback
                outputText.select();
                document.execCommand('copy');
                alert('✅ 已复制！');
            });
        });

        // ---- 反向导入 CSV ----
        function importCSV(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length === 0) return 0;

            // 先清空
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    gridData[r][c] = '';
                }
            }

            let count = 0;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // 跳过表头行（如果包含中文列名或非数字开头）
                if (line.startsWith('行') || line.startsWith('row') || line.startsWith('Row')) continue;

                const parts = line.split(',');
                if (parts.length < 3) continue;

                const row = parseInt(parts[0], 10);
                const col = parseInt(parts[1], 10);
                // 符号可能包含逗号，所以第3列及之后的部分合并
                const symbol = parts.slice(2).join(',').trim();

                if (isNaN(row) || isNaN(col) || row < 0 || row >= GRID || col < 0 || col >= GRID) continue;
                if (!symbol) continue;

                gridData[row][col] = symbol.substring(0, 10);
                count++;
            }
            return count;
        }

        document.getElementById('importBtn').addEventListener('click', function() {
            const text = outputText.value.trim();
            if (!text) {
                alert('请先在文本框中粘贴 CSV 数据，格式：行,列,符号');
                return;
            }
            if (!confirm('导入将清空当前所有标注并用 CSV 数据填充，确认继续？')) return;

            const count = importCSV(text);
            draw();
            alert(`✅ 导入成功！共填充 ${count} 个格子。`);
        });

        // ---- 键盘快捷键：点击格子后可直接按数字/字母 ----
        // 更高级的用法：先按一个键进入“输入模式”，再点击格子。
        // 但为了简洁，我们保留 prompt 方式。也可增加一个模式切换。
        // 额外：双击格子快速填入预设符号？这里不增加复杂度。

        // ---- 右键阻止上下文菜单 ----
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---- 绑定鼠标事件 ----
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // 右键
                handleCanvasRightClick(e);
            }
        });

        // ---- 初始绘制 ----
        draw();

        // 提示用户上传图片
        console.log('请上传一张地图图片开始标注。');
    })();
</script>

</body>
</html>
